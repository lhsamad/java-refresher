<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account - E-Commerce Store</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        nav a { margin-left: 1.25rem; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.95rem; }
        nav a:hover { color: var(--primary); }
        .wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 2.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
            text-align: center;
            color: #1e293b;
        }
        p.subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            margin-bottom: 1.75rem;
            text-align: center;
        }
        .alert-error {
            background: var(--danger-bg);
            color: #991b1b;
            border: 1px solid #fecaca;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.75rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.15s ease;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .field-error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 0.35rem;
        }
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            background: var(--primary-dark);
        }
        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .footer-text a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">E-Commerce Store (Spring MVC)</a>
        <nav>
            <a href="/">Home</a>
            <a href="/web/products">Products</a>
            <a href="/login">Sign In</a>
        </nav>
    </header>

    <div class="wrapper">
        <div class="card">
            <h1>Create Account</h1>
            <p class="subtitle">Join to start shopping and tracking your orders</p>

            <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${registerForm}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" placeholder="e.g. Alex Morgan">
                </div>

                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="e.g. alexmorgan" required>
                    <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="e.g. alex@example.com" required>
                    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password (at least 6 characters) *</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="Create password" required>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <button type="submit" class="btn-submit">Register Account</button>
            </form>

            <div class="footer-text">
                Already have an account? <a href="/login">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
