<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - E-Commerce Store</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        nav a { margin-left: 1.25rem; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.95rem; }
        .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.75rem; margin-bottom: 1.5rem; }
        h2 { font-size: 1.2rem; margin-bottom: 1rem; color: #1e293b; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        th, td { padding: 0.75rem 0.5rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-size: 0.85rem; text-transform: uppercase; color: var(--muted); }
        .total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 700; color: #047857; margin-top: 1rem; }
        .user-info { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .btn-place-order { width: 100%; background: #059669; color: white; padding: 0.9rem; border-radius: 8px; font-size: 1.1rem; font-weight: 700; border: none; cursor: pointer; transition: background 0.15s; }
        .btn-place-order:hover { background: #047857; }
        .btn-back { display: block; text-align: center; margin-top: 1rem; color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">E-Commerce Store (Spring MVC)</a>
        <nav>
            <a href="/cart">Back to Cart</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h1>Review & Confirm Order</h1>

            <h2>Customer Information</h2>
            <div class="user-info">
                <div>Account: <strong sec:authentication="name">User</strong></div>
                <div style="color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem;">Payment Method: Pay on Delivery / Express Simulator</div>
            </div>

            <h2>Items in Order (<span th:text="${cart.totalQuantity}">0</span> items)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Unit Price</th>
                        <th>Qty</th>
                        <th style="text-align: right;">Subtotal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cart.itemList}">
                        <td th:text="${item.productName}">Product</td>
                        <td th:text="'$' + ${item.unitPrice}">$0.00</td>
                        <td th:text="${item.quantity}">1</td>
                        <td style="text-align: right;" th:text="'$' + ${item.subtotal}">$0.00</td>
                    </tr>
                </tbody>
            </table>

            <div class="total-row">
                <span>Total Amount:</span>
                <span th:text="'$' + ${cart.totalAmount}">$0.00</span>
            </div>

            <form th:action="@{/checkout}" method="post" style="margin-top: 2rem;">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-place-order">Place Order Now</button>
                <a href="/cart" class="btn-back">&larr; Return to Cart</a>
            </form>
        </div>
    </div>
</body>
</html>
