<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Spring MVC</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
        header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        nav a { margin-left: 1.25rem; text-decoration: none; color: var(--muted); font-weight: 500; font-size: 0.95rem; }
        .container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.4rem; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 0.65rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }
        textarea { height: 100px; resize: vertical; }
        .error { color: var(--danger); font-size: 0.85rem; margin-top: 0.3rem; }
        .actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .btn { display: inline-block; padding: 0.65rem 1.25rem; border-radius: 6px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; font-size: 0.95rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    </style>
</head>
<body>
    <header>
        <a href="/" class="logo">E-Commerce Store (Spring MVC)</a>
        <nav style="display: flex; align-items: center; gap: 1rem;">
            <a href="/">Home</a>
            <a href="/web/products">Products</a>
            <a href="/swagger-ui.html" target="_blank">Swagger OpenAPI</a>

            <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 0.75rem; margin-left: 0.5rem;">
                <span style="font-size: 0.9rem; color: var(--muted);">
                    Hello, <strong style="color: var(--text);" sec:authentication="name">User</strong>
                </span>
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-outline" style="padding: 0.3rem 0.65rem; font-size: 0.8rem;">Logout</button>
                </form>
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h1>Create New Product (Server-Side MVC)</h1>
            <form th:action="@{/web/products}" th:object="${productForm}" method="post">
                <div class="form-group">
                    <label for="name">Product Name *</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="e.g. Ergonomic Office Chair">
                    <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" th:field="*{category}" placeholder="e.g. Furniture, Electronics">
                </div>

                <div class="form-group">
                    <label for="price">Price ($) *</label>
                    <input type="number" step="0.01" id="price" th:field="*{price}" placeholder="e.g. 199.99">
                    <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>

                <div class="form-group">
                    <label for="stockQuantity">Stock Quantity *</label>
                    <input type="number" id="stockQuantity" th:field="*{stockQuantity}" placeholder="e.g. 50">
                    <div class="error" th:if="${#fields.hasErrors('stockQuantity')}" th:errors="*{stockQuantity}"></div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" placeholder="Detailed product specifications..."></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Save Product</button>
                    <a href="/web/products" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
